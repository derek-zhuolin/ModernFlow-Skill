      /* @FONTS:BEGIN@ */
/* fonts.css — generated by scripts/fetch_fonts.py. Do not hand-edit.
 * Character set: 0 CJK + 95 latin. Re-run after any copy change.
 *
 * url() is relative to the HTML DOCUMENT, not to this file. Inline this
 * CSS into the page. A <link> makes the browser resolve url() against
 * this file's own directory, which 404s every face and silently falls
 * back to a system font.
 *
 * font-display is block, not swap: frame-by-frame capture would freeze
 * the fallback font into the opening frames of a render.
 */

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 500;
  font-display: block;
  src: url(assets/fonts/inter-500.woff2) format('woff2');
  unicode-range: U+20-7e;
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url(assets/fonts/inter-700.woff2) format('woff2');
  unicode-range: U+20-7e;
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 900;
  font-display: block;
  src: url(assets/fonts/inter-900.woff2) format('woff2');
  unicode-range: U+20-7e;
}
/* @FONTS:END@ */
      /* @BASE:BEGIN@ */
/* modernflow — base.css
 *
 * Everything a standalone diagram needs: style tokens, text roles, shape
 * classes, and a pure-CSS motion vocabulary. No JavaScript, no libraries.
 *
 * Timing model
 * ------------
 * Every animated element carries a class and one inline custom property:
 *
 *     <g class="dm mf-rise" style="--at:1.42s">…</g>
 *
 * `--at` is the element's start time on the figure's timeline. That single
 * number is also what the video tier feeds to GSAP, so one timing table drives
 * both outputs and they cannot drift apart.
 *
 * Path drawing uses the SVG `pathLength="1"` attribute rather than measuring
 * geometry in JavaScript:
 *
 *     <path class="dm mf-draw" pathLength="1" style="--at:2.0s" d="…"/>
 *
 * With pathLength="1" the dash units are normalised, so `stroke-dasharray: 1`
 * always means "exactly one full length" no matter how long the path really is.
 *
 * Profiles
 * --------
 * Set `data-profile="soft-gradient"` or `data-profile="editorial-paper"` on the
 * root element. Values mirror assets/tokens.json; see reference/style-profiles.md
 * for why the grey ramps are darker than they look in the source imagery.
 */

/* ─────────────────────────────────────────────────────────── tokens ───── */

[data-profile="soft-gradient"] {
  --paper: #fbfdfd;
  --ink: #17181a;
  --muted: #5e6470;
  --soft: #585c60;
  --rule: rgba(23, 24, 26, 0.10);
  --card: #ffffff;
  --accent: #0071ec;
  --accent-tint: rgba(0, 113, 236, 0.07);
  --accent-text: #0071ec;   /* the blue clears AA as text, so it is its own text token */
  --arrow: #c9ccd1;
  --glow-warm: #fec0e2;
  --glow-cool: #a8ecf0;

  --font-display: "Inter", system-ui, sans-serif;
  --font-title: "Noto Sans SC", "Inter", system-ui, sans-serif;
  --font-node: "Noto Sans SC", "Inter", system-ui, sans-serif;
  --font-eyebrow: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "Inter", system-ui, sans-serif;

  --w-title: 900;
  --w-node: 700;

  --dur: 0.40s;
  --dur-fast: 0.30s;
}

[data-profile="editorial-paper"] {
  --paper: #f5f5f5;
  --paper-2: #ececec;
  --ink: #2d3142;
  --muted: #4f5d75;
  --soft: #586377;
  --rule: rgba(45, 49, 66, 0.12);
  --rule-solid: #bfc0c0;
  --card: #ffffff;
  --accent: #eb6c36;
  --accent-ink: #a33f14;
  --accent-tint: rgba(235, 108, 54, 0.08);
  --accent-text: #a33f14;   /* the orange is 2.86:1 as text — stroke only. This is its text-safe twin. */
  --arrow: #4f5d75;
  --link: #2e5aa8;

  --font-display: "Instrument Serif", "Noto Serif SC", Georgia, serif;
  --font-title: "Instrument Serif", "Noto Serif SC", Georgia, serif;
  --font-node: "Geist", "Noto Sans SC", system-ui, sans-serif;
  --font-eyebrow: "Geist Mono", "Noto Sans SC", ui-monospace, monospace;
  --font-body: "Geist", "Noto Sans SC", system-ui, sans-serif;
  --font-sublabel: "Geist Mono", "Noto Sans SC", ui-monospace, monospace;

  --w-title: 400;
  --w-node: 600;

  --dur: 0.44s;
  --dur-fast: 0.34s;
}

/* ─────────────────────────────────────────────────────────── canvas ───── */

.mf-stage {
  position: relative;
  overflow: hidden;
  background: var(--paper);
}
.mf-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ──────────────────────────────────────────────────────── text roles ───── */
/* Sizes are viewBox units. Author at the profile's viewBox, render at 2x. */

.mf-eyebrow {
  font-family: var(--font-eyebrow);
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
  fill: var(--soft);
}
.mf-title   { font-family: var(--font-title); font-size: 54px; font-weight: var(--w-title); letter-spacing: -0.02em; fill: var(--ink); }
.mf-display { font-family: var(--font-display); font-size: 86px; font-weight: 900; letter-spacing: -0.035em; fill: var(--ink); }
.mf-lede    { font-family: var(--font-body); font-size: 15px; font-weight: 400; fill: var(--muted); }
.mf-node    { font-family: var(--font-node); font-size: 17px; font-weight: var(--w-node); fill: var(--ink); text-anchor: middle; }
.mf-sub     { font-family: var(--font-eyebrow); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--soft); text-anchor: middle; }
.mf-edge    { font-family: var(--font-eyebrow); font-size: 12px; font-weight: 500; letter-spacing: 0.06em; fill: var(--muted); text-anchor: middle; }
.mf-tag     { font-family: var(--font-eyebrow); font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; fill: var(--soft); }
.mf-num     { font-family: var(--font-display); font-size: 26px; font-weight: 900; letter-spacing: -0.02em; fill: var(--accent-text); }

/* The one background layer that is allowed to be huge and nearly invisible.
   It is a layer, not decoration: it names the figure at poster scale. */
.mf-watermark { font-family: var(--font-display); font-size: 176px; font-weight: 900; letter-spacing: -0.03em; fill: var(--ink); opacity: 0.04; }

/* ─────────────────────────────────────────────────────────── shapes ───── */

.mf-card    { fill: var(--card); }
.mf-store   { fill: var(--ink); }                       /* dark hub / shared state */
.mf-ghost   { fill: rgba(0, 0, 0, 0.03); stroke: rgba(0, 0, 0, 0.30); stroke-width: 1; }
.mf-focal   { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2; }
.mf-flow    { fill: none; stroke: var(--arrow); stroke-width: 1.4; }
.mf-flow-a  { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
.mf-dash    { fill: none; stroke: rgba(0, 0, 0, 0.22); stroke-width: 1.4; stroke-dasharray: 5 5; }
.mf-head    { fill: var(--arrow); }
.mf-head-a  { fill: var(--accent); }
.mf-rule    { stroke: var(--rule); stroke-width: 1; }

/* Hand-drawn marker: a blue oval or underline scribbled around something that
   matters. Pair with filter="url(#mf-sketch)" (defined in the template). */
.mf-mark    { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }

/* Card lift is an SVG filter (#mf-lift, defined in the template), applied to
   the SHAPE with filter="url(#mf-lift)" — never as a CSS class on the group.
   Two reasons, both of which bite:
     1. CSS drop-shadow() on an SVG element clips to that element's default
        filter region and leaves a hard edge partway through the shadow.
     2. The entrance animation animates the CSS `filter` property. A CSS
        drop-shadow on the same element loses that fight and vanishes.
   Putting the SVG filter on the child shape and the animation on the parent
   group keeps them out of each other's way. */

/* Bordered card — the editorial-paper register draws its cards instead of
   floating them. Pairs with a flat paper and no shadow. */
.mf-card-lined { fill: var(--card); stroke: var(--ink); stroke-width: 1; }

/* ──────────────────────────────────────────────────── motion vocabulary ── */
/* Four entrances, one exit. Use a different entrance per scene; keep the exit
   identical everywhere. Rationale in reference/motion-grammar.md. */

.dm {
  animation-delay: var(--at, 0s);
  animation-duration: var(--dur);
  animation-fill-mode: both;          /* hidden before --at, settled after */
  animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);   /* expo-out */
}

@keyframes mf-rise   { from { opacity: 0; transform: translateY(20px);  filter: blur(8px); }
                       to   { opacity: 1; transform: none;              filter: blur(0);  } }
@keyframes mf-settle { from { opacity: 0; transform: translateY(-14px); filter: blur(8px); }
                       to   { opacity: 1; transform: none;              filter: blur(0);  } }
@keyframes mf-widen  { from { opacity: 0; transform: scale(0.94);       filter: blur(8px); }
                       to   { opacity: 1; transform: none;              filter: blur(0);  } }
@keyframes mf-slide  { from { opacity: 0; transform: translateX(22px);  filter: blur(8px); }
                       to   { opacity: 1; transform: none;              filter: blur(0);  } }

/* Node entrance: smaller displacement than a title, same blur discipline.
   Position and sharpness must resolve together — moving without blurring is
   what reads as "stiff". */
@keyframes mf-pop    { from { opacity: 0; transform: translateY(14px) scale(0.985); filter: blur(6px); }
                       to   { opacity: 1; transform: none;                          filter: blur(0);  } }

@keyframes mf-out    { from { opacity: 1; transform: none;              filter: blur(0);  }
                       to   { opacity: 0; transform: translateY(-16px); filter: blur(8px); } }

.mf-rise   { animation-name: mf-rise; }
.mf-settle { animation-name: mf-settle; }
.mf-widen  { animation-name: mf-widen; }
.mf-slide  { animation-name: mf-slide; }
.mf-pop    { animation-name: mf-pop; animation-duration: var(--dur); }
.mf-out    { animation-name: mf-out; animation-duration: var(--dur-fast);
             animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }  /* power3-in */

/* Stroke draw. Requires pathLength="1" on the element — then one dash unit is
   one full path and no JavaScript measurement is needed. */
@keyframes mf-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.mf-draw {
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation-name: mf-draw;
  animation-timing-function: cubic-bezier(0.76, 0, 0.24, 1);   /* power4-in-out */
}

/* Arrowheads land after their line arrives, never with it. */
@keyframes mf-tip { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: none; } }
.mf-tip { animation-name: mf-tip; animation-duration: 0.22s; }

/* One-shot emphasis. Never loop this: a pulse that repeats stops reading as
   emphasis and starts reading as idle wobble. */
@keyframes mf-flash { 0% { opacity: 1; } 35% { opacity: 0.35; } 100% { opacity: 1; } }
.mf-flash { animation-name: mf-flash; animation-duration: 0.58s; }

/* Transform origins must be explicit on SVG children, otherwise scale and
   translate pivot on the whole canvas instead of the element. */
.dm, .mf-draw, .mf-tip, .mf-flash { transform-box: fill-box; transform-origin: center; }

/* Honour the reader's setting for the standalone HTML tier. The video tier
   renders frames and is unaffected. */
@media (prefers-reduced-motion: reduce) {
  .dm, .mf-draw, .mf-tip, .mf-flash { animation: none !important; opacity: 1 !important;
    transform: none !important; filter: none !important; stroke-dashoffset: 0 !important; }
}
/* @BASE:END@ */

      html, body { margin: 0; background: #0b0b0c; display: grid; place-items: center; min-height: 100vh; }
      /* Canvas size. Swap for 1080x1920 (portrait) or 1080x1080 (square) and
         change the viewBox below to match — see reference/style-profiles.md. */
      .mf-stage { width: 1920px; height: 1080px; transform-origin: center;
                  transform: scale(min(1, calc(100vw / 1920))); }
    </style>
  </head>
  <body>
    <!-- Profile switch. "editorial-paper" is the other one. -->
    <div class="mf-stage" data-profile="soft-gradient">
      <!-- Author in viewBox units; the stage renders at 2x. Every coordinate
           below sits on the 4px grid. -->
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="A decision flow: start, check a condition, exit if it fails, otherwise run the step and finish.">
        <defs>
          <!-- Colour fields. Only the soft-gradient profile uses these; delete
               the whole <g id="mf-field"> for editorial-paper.
               Eight stops, not three: a low-contrast field this large shows
               concentric banding when interpolated across three. -->
          <radialGradient id="mf-warm">
            <stop offset="0%"   stop-color="var(--glow-warm)" stop-opacity="0.95" />
            <stop offset="15%"  stop-color="var(--glow-warm)" stop-opacity="0.91" />
            <stop offset="30%"  stop-color="var(--glow-warm)" stop-opacity="0.79" />
            <stop offset="45%"  stop-color="var(--glow-warm)" stop-opacity="0.61" />
            <stop offset="60%"  stop-color="var(--glow-warm)" stop-opacity="0.39" />
            <stop offset="75%"  stop-color="var(--glow-warm)" stop-opacity="0.18" />
            <stop offset="90%"  stop-color="var(--glow-warm)" stop-opacity="0.03" />
            <stop offset="100%" stop-color="var(--glow-warm)" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="mf-cool">
            <stop offset="0%"   stop-color="var(--glow-cool)" stop-opacity="0.80" />
            <stop offset="15%"  stop-color="var(--glow-cool)" stop-opacity="0.76" />
            <stop offset="30%"  stop-color="var(--glow-cool)" stop-opacity="0.66" />
            <stop offset="45%"  stop-color="var(--glow-cool)" stop-opacity="0.51" />
            <stop offset="60%"  stop-color="var(--glow-cool)" stop-opacity="0.33" />
            <stop offset="75%"  stop-color="var(--glow-cool)" stop-opacity="0.15" />
            <stop offset="90%"  stop-color="var(--glow-cool)" stop-opacity="0.03" />
            <stop offset="100%" stop-color="var(--glow-cool)" stop-opacity="0" />
          </radialGradient>
          <filter id="mf-soften" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="26" />
          </filter>
          <!-- Dither. Smooth stops fix the SVG side; 8-bit video encoding still
               quantises a field this gradual into rings. Static noise breaks the
               quantisation boundaries. Fixed seed, so every frame is identical. -->
          <filter id="mf-grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="7" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <!-- Hand-drawn wobble for the blue marker only. Keep scale low: past
               ~3 it starts chewing the glyphs of anything it touches. -->
          <!-- Card lift: two shadows, one tight contact + one wide ambient.
               The region is generous on purpose — the default -10%/+120% box
               clips a soft shadow and leaves a visible straight edge. -->
          <filter id="mf-lift" x="-40%" y="-40%" width="180%" height="200%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17181a" flood-opacity="0.09" />
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17181a" flood-opacity="0.06" />
          </filter>
          <filter id="mf-sketch" x="-8%" y="-8%" width="116%" height="116%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" />
            <feDisplacementMap in="SourceGraphic" scale="2.6" />
          </filter>
        </defs>

        <g id="mf-field">
          <g filter="url(#mf-soften)">
            <ellipse cx="150" cy="90"  rx="300" ry="200" fill="url(#mf-warm)" />
            <ellipse cx="740" cy="430" rx="320" ry="240" fill="url(#mf-cool)" />
          </g>
          <rect width="960" height="540" filter="url(#mf-grain)" opacity="0.045" />
        </g>

        <text class="mf-watermark" x="480" y="330" text-anchor="middle">FLOW</text>

        <!-- ── chrome: same slots in every scene, that is what makes a set ── -->
        <text class="dm mf-settle mf-eyebrow" style="--at:0.10s" x="60" y="64">SECTION LABEL · SUBTITLE</text>
        <text class="dm mf-rise mf-title"     style="--at:0.24s" x="60" y="112">Your headline here</text>
        <line class="dm mf-draw mf-rule" style="--at:0.45s" pathLength="1" x1="60" y1="150" x2="900" y2="150" />

        <!-- ── figure: replace this with the type you need ─────────────────
             Shape carries meaning, fill never does:
               pill = start/end · rectangle = step · diamond = decision
             Every edge out of a diamond is labelled. One accent per figure. -->
        <g class="dm mf-pop" style="--at:1.00s">
          <rect class="mf-card" filter="url(#mf-lift)" x="85" y="277" width="130" height="46" rx="23" />
          <text class="mf-node" x="150" y="299">START</text>
          <text class="mf-sub"  x="150" y="314">entry</text>
        </g>

        <path class="dm mf-draw mf-flow" style="--at:1.20s" pathLength="1" d="M 215 300 L 261 300" />
        <g transform="translate(265,300)"><polygon class="dm mf-tip mf-head" style="--at:1.46s" points="0,0 -11,-5.2 -11,5.2" /></g>

        <g class="dm mf-pop" style="--at:1.35s">
          <polygon class="mf-card" filter="url(#mf-lift)" points="350,230 435,300 350,370 265,300" />
          <text class="mf-node" x="350" y="299">Condition?</text>
          <text class="mf-sub"  x="350" y="314">decide</text>
        </g>

        <path class="dm mf-draw mf-flow" style="--at:1.65s" pathLength="1" d="M 350 230 L 350 200" />
        <g transform="translate(350,196) rotate(-90)"><polygon class="dm mf-tip mf-head" style="--at:1.91s" points="0,0 -11,-5.2 -11,5.2" /></g>
        <text class="dm mf-widen mf-edge" style="--at:1.95s" x="372" y="218" text-anchor="start">NO</text>

        <g class="dm mf-pop" style="--at:1.85s">
          <rect class="mf-ghost" filter="url(#mf-lift)" x="285" y="150" width="130" height="46" rx="8" />
          <text class="mf-node" x="350" y="172">EXIT</text>
          <text class="mf-sub"  x="350" y="187">bail out</text>
        </g>

        <text class="dm mf-widen mf-edge" style="--at:2.05s" x="460" y="288">YES</text>
        <path class="dm mf-draw mf-flow" style="--at:2.10s" pathLength="1" d="M 435 300 L 486 300" />
        <g transform="translate(490,300)"><polygon class="dm mf-tip mf-head" style="--at:2.36s" points="0,0 -11,-5.2 -11,5.2" /></g>

        <g class="dm mf-pop" style="--at:2.45s">
          <rect class="mf-card" filter="url(#mf-lift)" x="490" y="277" width="140" height="46" rx="13" />
          <text class="mf-node" x="560" y="299">Run the step</text>
          <text class="mf-sub"  x="560" y="314">the work</text>
        </g>

        <path class="dm mf-draw mf-flow" style="--at:2.75s" pathLength="1" d="M 630 300 L 701 300" />
        <g transform="translate(705,300)"><polygon class="dm mf-tip mf-head" style="--at:3.01s" points="0,0 -11,-5.2 -11,5.2" /></g>

        <!-- ▼ the one accent: the path that actually completes -->
        <g class="dm mf-pop" style="--at:3.10s">
          <rect class="mf-focal" x="705" y="277" width="130" height="46" rx="23" />
          <text class="mf-node" x="770" y="299">DONE</text>
          <text class="mf-sub"  x="770" y="314">shipped</text>
        </g>
        <g class="dm mf-flash" style="--at:3.45s">
          <ellipse class="mf-mark" cx="770" cy="300" rx="82" ry="36"
                   transform="rotate(-3 770 300)" filter="url(#mf-sketch)" />
        </g>

        <!-- ── chrome: footer ──────────────────────────────────────────── -->
        <line class="dm mf-draw mf-rule" style="--at:0.55s" pathLength="1" x1="60" y1="440" x2="900" y2="440" />
        <text class="dm mf-rise mf-num" style="--at:0.60s" x="60" y="486">01</text>
        <text class="dm mf-rise mf-tag" style="--at:0.67s" x="60" y="506">THE SECTION</text>
        <text class="dm mf-rise mf-tag" style="--at:0.74s" x="900" y="486" text-anchor="end">PROJECT NAME</text>
        <text class="dm mf-rise mf-tag" style="--at:0.81s" x="900" y="504" text-anchor="end">OR TAGLINE</text>
      </svg>
    </div>
  </body>
</html>
